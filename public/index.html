<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetPulse — Lost Pet Alert</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #17211b;
    }

    header {
      background: #17211b;
      color: white;
      padding: 28px 20px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #c9d4cc;
    }

    main {
      max-width: 1050px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5ce;
      border-radius: 9px;
      font: inherit;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #17211b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 14px;
      color: #536057;
      font-size: 14px;
    }

    #result {
      white-space: pre-wrap;
      line-height: 1.6;
      min-height: 300px;
      color: #26342b;
    }

    .local {
      display: inline-block;
      margin-top: 15px;
      padding: 7px 10px;
      border-radius: 20px;
      background: #e5eee7;
      font-size: 13px;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🐾 PetPulse</h1>
    <p>Turn your pet's details into a clear lost-pet alert.</p>
  </header>

  <main>

    <section class="card">
      <h2>Pet information</h2>

      <label for="name">Pet name</label>
      <input id="name" placeholder="Example: Luna">

      <label for="type">Animal type</label>
      <input id="type" placeholder="Example: Cat">

      <label for="appearance">Appearance</label>
      <textarea id="appearance" placeholder="Color, size, collar, markings..."></textarea>

      <label for="location">Last seen location</label>
      <input id="location" placeholder="Example: Riverside neighborhood">

      <label for="features">Distinctive features</label>
      <textarea id="features" placeholder="Anything that helps identify your pet"></textarea>

      <label for="contact">Contact information</label>
      <input id="contact" placeholder="Phone, email, or social handle">

      <button id="generate">Generate PetPulse Alert</button>

      <div id="status"></div>

      <span class="local">🔒 QVAC on-device AI</span>
    </section>

    <section class="card">
      <h2>Your alert</h2>
      <div id="result">
        Your generated lost-pet alert will appear here.
      </div>
    </section>

  </main>

  <script>
    const button = document.getElementById("generate");
    const result = document.getElementById("result");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      const pet = {
        name: document.getElementById("name").value,
        type: document.getElementById("type").value,
        appearance: document.getElementById("appearance").value,
        location: document.getElementById("location").value,
        features: document.getElementById("features").value,
        contact: document.getElementById("contact").value
      };

      status.textContent = "QVAC is generating your alert...";
      result.textContent = "";

      try {
        const response = await fetch("/api/petpulse", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(pet)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        result.textContent = data.result;
        status.textContent = "Alert generated locally.";
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>

</body>
</html>
